name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: |
          (cd packages/crew && bun install --silent)
          (cd packages/wrangler && bun install --silent)
      - name: Verify
        run: |
          bun run typecheck
          bun run smoke
          bun run test:wrangler
      - run: bash scripts/build-release.sh
      - run: |
          mkdir -p release
          cp dist/crew-darwin-arm64 dist/crew-darwin-x64 dist/crew-linux-arm64 dist/crew-linux-x64 dist/crew-windows-x64.exe release/
          cp dist/wrangler.zip release/
          cp packages/wrangler/main.js packages/wrangler/manifest.json packages/wrangler/styles.css release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
